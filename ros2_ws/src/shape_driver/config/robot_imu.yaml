shape_driver:
  ros__parameters:
    cmd_vel_topic: /cmd_vel_raw     # über obstacle_stop (einziger Publisher auf /cmd_vel)
    num_sides: 4
    side_length: 0.30
    linear_speed: 0.03129           # kalibriert (Stufe 9b)
    angular_speed: 0.3692           # kalibriert (Stufe 9b); im IMU-Modus nur Drehrate
    publish_rate: 20.0
    turn_mode: imu                  # Stufe 11f-c
    imu_topic: /imu
    turn_lead_deg: 0.0              # zuerst 0: Nachdrehen messen, dann einstellen
    settle_time: 0.5
    imu_timeout: 0.5
