; Stufe 8/9: robot_base – Differentialantrieb über micro-ROS
; Zwei Umgebungen mit identischem Code, nur der Transport unterscheidet sich:
;   pio run -e serial ...   micro-ROS über USB-Seriell (wie Stufe 8)
;   pio run -e wifi   ...   micro-ROS über WLAN/UDP (Stufe 9), Zugangsdaten in include/secrets.h

[env]
; Versionen festgeschrieben (in Stufe 5/6 erfolgreich getestete Kombination)
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
board_microros_distro = humble
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio#cfee17f
    olikraus/U8g2 @ ^2.35.0
[env:serial]
board_microros_transport = serial

[env:wifi]
board_microros_transport = wifi

; v7.4 (optional, Anleitung 4.1.4): Firmware-Update über WLAN.
; Gleicher Code wie env:wifi. IP und Passwort kommen aus Umgebungsvariablen, damit sie nicht im Repository stehen:
;   export ROBOT_IP=<IP aus dem Display>      export OTA_PASSWORD=<wie in include/secrets.h>
;   pio run -e ota -t upload
[env:ota]
extends = env:wifi
upload_protocol = espota
upload_port = ${sysenv.ROBOT_IP}
upload_flags = --auth=${sysenv.OTA_PASSWORD}
