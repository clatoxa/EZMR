[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; micro-ROS: Distribution und Transport ausdrücklich festlegen
; (Standard von micro_ros_platformio wäre "kilted" -> passt nicht zum Humble-Agent)
board_microros_distro = humble
board_microros_transport = serial

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
